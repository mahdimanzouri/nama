name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nama
          POSTGRES_PASSWORD: nama-owner-dev
          POSTGRES_DB: nama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nama -d nama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Workspace boundaries
        run: pnpm verify:workspace

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare database
        env:
          DATABASE_URL: postgresql://nama:nama-owner-dev@localhost:5432/nama
          PGPASSWORD: nama-owner-dev
        run: |
          psql -h localhost -U nama -d nama -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
          pnpm --filter @nama/api exec prisma migrate deploy
          pnpm --filter @nama/api exec prisma db seed

      - name: Test
        env:
          NAMA_TEST_DATABASE_URL: postgresql://nama_app:nama-app-dev@localhost:5432/nama
        run: pnpm test

      - name: OpenAPI drift
        run: pnpm verify:openapi

      - name: Build
        run: pnpm build
