        '200':
          description: Permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/me/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Read user preferences
      x-m0-status: implemented
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Preferences]
      operationId: updatePreferences
      summary: Update user preferences
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nama_session
      description: Opaque server-side session; httpOnly, Secure, SameSite=Lax.
    embedBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Scoped, expiring, revocable embed token.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Last known revision as a quoted integer (for example `"12"`). Stale values return 409.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated mutations; validated by double-submit.
      schema: { type: string }
    DashboardId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DataSourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmbedTokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource absent or outside tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Stale revision, duplicate resource or idempotency mismatch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Domain validation failed with field paths
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: Configuration exceeds 1 MiB or 100 widgets
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UpstreamError:
      description: Data source unreachable or rejected credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UpstreamTimeout:
      description: Query exceeded the 15 s timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Unexpected failure; request ID only
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: REVISION_CONFLICT }
            message: { type: string }
            requestId: { type: string }
            fieldPaths:
              type: array
              items:
                oneOf:
                  - { type: string }
                  - { type: integer }
            issues:
              type: array
              items: { $ref: '#/components/schemas/ValidationIssue' }
            currentRevision: { type: integer }
            retryAfterMs: { type: integer }
    StreamMode:
      type: string
      enum: [snapshot-then-stream, stream]
      default: snapshot-then-stream
      description: |
        `snapshot-then-stream` emits an authoritative snapshot per server poll;
        `stream` emits throttled `data` events (250 ms) after the first snapshot.
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    SessionUser:
      type: object
      required: [id, email, displayName, locale, theme, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { type: string, enum: [en, fa] }
        theme: { type: string, enum: [light, dark, system] }
        timezone: { type: string, example: UTC }
    SessionOrganization:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    SessionPayload:
      type: object
      required:
        [user, organization, role, roleNames, permissions, csrfToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/SessionUser' }
        organization: { $ref: '#/components/schemas/SessionOrganization' }
        role:
          type: string
          description: Primary role name (first assigned role, custom roles included).
          example: editor
        roleNames:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [id, organizationId, name, revision, publishedRevision, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        revision:
          type: integer
          description: Current revision of the draft; advances on every save.
        publishedRevision:
          type: integer
          nullable: true
          description: Revision that was last published; never advances on draft saves.
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
    DashboardView:
      allOf:
        - $ref: '#/components/schemas/DashboardSummary'
        - type: object
          required: [publishedConfig, permissions]
          properties:
            publishedConfig:
              allOf:
                - $ref: '#/components/schemas/DashboardConfig'
              nullable: true
            permissions:
              type: array
              items: { type: string }
    DashboardDraft:
      type: object
      required: [config, revision, updatedAt]
      properties:
        config: { $ref: '#/components/schemas/DashboardConfig' }
        revision: { type: integer }
        updatedAt: { type: string, format: date-time }
    RevisionResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
    DashboardList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardSummary' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    DashboardConfig:
      type: object
      required: [schemaVersion, metadata, settings, variables, filters, layouts, widgets]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        metadata: { $ref: '#/components/schemas/DashboardMetadata' }
        settings: { $ref: '#/components/schemas/DashboardSettings' }
        variables:
          type: array
          items: { $ref: '#/components/schemas/DashboardVariable' }
        filters:
          type: array
          items: { $ref: '#/components/schemas/DashboardFilter' }
        layouts: { $ref: '#/components/schemas/DashboardLayouts' }
        widgets:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DashboardWidget' }
    DashboardMetadata:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
    DashboardSettings:
      type: object
      properties:
        refreshInterval: { type: integer, minimum: 0, default: 60 }
        timezone: { type: string, example: Asia/Tehran }
    DashboardLayouts:
      type: object
      required: [desktop, tablet, mobile]
      properties:
        desktop: { $ref: '#/components/schemas/DashboardLayout' }
        tablet: { $ref: '#/components/schemas/DashboardLayout' }
        mobile: { $ref: '#/components/schemas/DashboardLayout' }
    DashboardLayout:
      type: object
      required: [columns, rowHeight, gap, items]
      properties:
        columns: { type: integer }
        rowHeight: { type: integer }
        gap: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/LayoutItem' }
    LayoutItem:
      type: object
      required: [widgetId, x, y, w, h]
      properties:
        widgetId: { type: string, format: uuid }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }
    DashboardWidget:
      type: object
      required: [id, type, configVersion, title, config]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: kpi }
        configVersion: { type: integer, minimum: 1 }
        title: { type: string }
        dataSourceId: { type: string, format: uuid }
        config:
          type: object
          additionalProperties: true
        query: { $ref: '#/components/schemas/QueryDefinition' }
        visibility:
          type: object
          properties:
            enabled: { type: boolean }
            condition: { type: string }
    DashboardVariable:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [string, number, boolean, date, timeRange]
        defaultValue: {}
        bindings:
          type: array
          items: { $ref: '#/components/schemas/VariableBinding' }
    VariableBinding:
      type: object
      required: [target, parameter]
      properties:
        target:
          type: string
          enum: [query.parameter, query.timeRange, filter.value]
        parameter: { type: string }
    DashboardFilter:
      type: object
      required: [id, field, operator, value]
      properties:
        id: { type: string, format: uuid }
        field: { type: string }
        operator:
          type: string
          enum: [eq, neq, in, contains, gt, gte, lt, lte, between]
        value: {}

    QueryDefinition:
      type: object
      required: [queryId, fields]
      properties:
        queryId: { type: string }
        dataset: { type: string }
        fields:
          type: array
          items: { type: string }
        aggregations:
          type: array
          items:
            type: object
            required: [field, fn]
            properties:
              field: { type: string }
              fn:
                type: string
                enum: [sum, avg, min, max, count]
        filters:
          type: array
          items: { $ref: '#/components/schemas/DashboardFilter' }
        groupBy:
          type: array
          items: { type: string }
        orderBy:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        limit: { type: integer, minimum: 1, maximum: 10000 }
        variableBindings:
          type: array
          items: { $ref: '#/components/schemas/VariableBinding' }
    QueryRequest:
      type: object
      required: [queryId, dataSourceId, query]
      properties:
        queryId: { type: string }
        dataSourceId: { type: string, format: uuid }
        query: { $ref: '#/components/schemas/QueryDefinition' }
        parameters:
          type: object
          additionalProperties: true
        timeRange:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
    QueryResult:
      type: object
      required: [queryId, columns, rows, timestamp, meta]
      properties:
        queryId: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/QueryColumn' }
        rows:
          type: array
          maxItems: 10000
          items:
            type: object
            additionalProperties: true
        timestamp: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/QueryMeta' }
    QueryColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        label: { type: string }
    QueryMeta:
      type: object
      required: [rowCount, truncated, executionTimeMs, cached]
      properties:
        rowCount: { type: integer }
        truncated: { type: boolean }
        executionTimeMs: { type: integer }
        cached: { type: boolean }
    QueryValidateResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: array
          items:
            oneOf:
              - { type: string }
              - { type: integer }
        message: { type: string }

    CreateDashboardRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    UpdateDashboardRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        metadata: { $ref: '#/components/schemas/DashboardMetadata' }
    SaveDraftRequest:
      type: object
      required: [config]
      properties:
        config: { $ref: '#/components/schemas/DashboardConfig' }
    PublishRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 500 }

    DashboardVersion:
      type: object
      required: [id, revision, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
    VersionList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardVersion' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    RestoreRequest:
      type: object
      required: [versionId]
      properties:
        versionId: { type: string, format: uuid }

    DashboardShare:
      type: object
      required: [subjectType, subjectId, permission]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, role, organization] }
        subjectId: { type: string, format: uuid }
        permission: { type: string, enum: [view, edit] }
    ShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardShare' }
    ShareListReplace:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/DashboardShare' }

    EmbedTokenRequest:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: { type: integer, minimum: 60, maximum: 31536000 }
        viewerIdentity: { type: string, maxLength: 200 }
        scope:
          type: object
          description: Optional pre-bound variables and filters; validated server-side.
          additionalProperties: true
    EmbedTokenIssued:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          description: Returned once; never retrievable again.
        expiresAt: { type: string, format: date-time }

    DataSourceSummary:
      type: object
      required: [id, name, kind, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [postgres, mysql, rest, mqtt, static] }
        status: { type: string, enum: [active, disabled, error] }
        allowRawSql: { type: boolean }
        limits:
          type: object
          description: Per-source caps that may only tighten the platform limits.
          properties:
            timeoutMs: { type: integer, maximum: 15000 }
            maxRows: { type: integer, maximum: 10000 }
            maxBytes: { type: integer, maximum: 5242880 }
            maxConcurrent: { type: integer, maximum: 32 }
        updatedAt: { type: string, format: date-time }
    DataSource:
      allOf:
        - $ref: '#/components/schemas/DataSourceSummary'
        - type: object
          properties:
            config:
              type: object
              additionalProperties: true
              description: Non-secret connection metadata only.
    DataSourceCreate:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string }
        kind: { type: string, enum: [postgres, mysql, rest, mqtt, static] }
        config:
          type: object
          additionalProperties: true
        credentials:
          type: object
          additionalProperties: true
          writeOnly: true
        allowRawSql: { type: boolean, default: false }
        limits:
          type: object
          properties:
            timeoutMs: { type: integer, minimum: 1, maximum: 15000 }
            maxRows: { type: integer, minimum: 1, maximum: 10000 }
            maxBytes: { type: integer, minimum: 1, maximum: 5242880 }
            maxConcurrent: { type: integer, minimum: 1, maximum: 32 }
    DataSourceUpdate:
      type: object
      properties:
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        credentials:
          type: object
          additionalProperties: true
          writeOnly: true
        allowRawSql: { type: boolean }
        limits:
          type: object
          properties:
            timeoutMs: { type: integer, minimum: 1, maximum: 15000 }
            maxRows: { type: integer, minimum: 1, maximum: 10000 }
            maxBytes: { type: integer, minimum: 1, maximum: 5242880 }
            maxConcurrent: { type: integer, minimum: 1, maximum: 32 }
        status: { type: string, enum: [active, disabled] }
    DataSourceTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        latencyMs: { type: number }
        message: { type: string }
        errorCode: { type: string }
    DataSourceSchema:
      type: object
      required: [dataSourceId, kind, capabilities, datasets]
      properties:
        dataSourceId: { type: string, format: uuid }
        kind: { type: string }
        capabilities:
          type: object
          required: [test, execute]
          properties:
            test: { type: boolean }
            execute: { type: boolean }
            stream: { type: boolean }
            rawSql: { type: boolean }
            schemaDiscovery: { type: boolean }
        datasets:
          type: array
          items:
            type: object
            required: [name, fields]
            properties:
              name: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [name, type]
                  properties:
                    name: { type: string }
                    type: { type: string }
                    label: { type: string }
    DataSourceList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DataSourceSummary' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    WidgetDefinition:
      type: object
      required: [type, manifest, configVersion, isBuiltin]
      properties:
        type: { type: string }
        manifest:
          type: object
          required: [id, version, name]
          properties:
            id: { type: string }
            version: { type: string }
            name: { type: string }
            description: { type: string }
            capabilities:
              type: object
              properties:
                realtime: { type: boolean }
                export: { type: boolean }
                filters: { type: boolean }
        configVersion: { type: integer }
        defaultSize:
          type: object
          properties:
            w: { type: integer }
            h: { type: integer }
        isBuiltin: { type: boolean }
    WidgetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WidgetDefinition' }

    Member:
      type: object
      required: [id, userId, email, status, roles]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [invited, active, suspended] }
        roles:
          type: array
          items: { type: string, format: uuid }
    MemberCreate:
      type: object
      required: [email, roleIds]
      properties:
        email: { type: string, format: email }
        roleIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    MemberUpdate:
      type: object
      properties:
        roleIds:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended] }
    MemberList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Role:
      type: object
      required: [id, name, isSystem, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isSystem: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    RoleCreate:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    RoleUpdate:
      type: object
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    Permission:
      type: object
      required: [key]
      properties:
        key: { type: string, example: dashboard.read }
        description: { type: string }
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    Preferences:
      type: object
      required: [locale, theme, timezone, defaultOrganizationId]
      properties:
        locale: { type: string, enum: [en, fa] }
        theme: { type: string, enum: [light, dark, system] }
        timezone: { type: string }
        defaultOrganizationId:
          type: string
          format: uuid
          nullable: true
    PreferencesUpdate:
      type: object
      properties:
        locale: { type: string, enum: [en, fa] }
        theme: { type: string, enum: [light, dark, system] }
        timezone: { type: string }
        defaultOrganizationId: { type: string, format: uuid }
