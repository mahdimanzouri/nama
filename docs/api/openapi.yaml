openapi: 3.0.3
info:
  title: Nama Dashboard Platform API
  version: 0.3.0-m4
  description: |
    Contract for the Nama dashboard platform API. The M4 editor slice implements
    authentication, dashboard list/create/draft/publish/restore, version listing,
    the published dashboard read and query execution; remaining paths are
    proposals. Management operations use REST; live updates use `/ws/v1` (see
    docs/architecture/realtime-protocol.md).

    Conventions:
    - All configuration writes carry `If-Match` with the last known revision.
    - Stale writes return `409` with the current revision.
    - Mutating cookie-authenticated requests carry `X-CSRF-Token`.
    - Retryable POST endpoints accept `Idempotency-Key`.
    - Timestamps are UTC ISO-8601. IDs are UUIDv7.
    - Errors use the ErrorEnvelope with a stable code and request ID.

    `x-m0-status` values: `implemented` (served by apps/api), `proposed`
    (contract reviewed, shapes may still change), `stub` (path reserved; detailed
    schema arrives with its milestone).
servers:
  - url: https://api.example.invalid
    description: Placeholder; deployment is unresolved (ADR-011)
security:
  - sessionCookie: []
  - embedBearer: []
tags:
  - name: Auth
  - name: Dashboards
  - name: Dashboard versions
  - name: Shares
  - name: Embed tokens
  - name: Data sources
  - name: Queries
  - name: Widgets
  - name: Realtime
  - name: Organizations
  - name: Roles
  - name: Preferences

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Verifies Argon2id credentials, creates an opaque 256-bit session stored
        hashed, and sets the httpOnly `nama_session` cookie plus the readable
        `nama_csrf` cookie. Credential failures return `401 INVALID_CREDENTIALS`.
      x-m0-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Session and CSRF cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPayload'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Read the current session
      x-m0-status: implemented
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPayload'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out; cookies cleared
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards:
    get:
      tags: [Dashboards]
      operationId: listDashboards
      summary: List authorized dashboards
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized dashboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Dashboards]
      operationId: createDashboard
      summary: Create a dashboard
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [Dashboards]
      operationId: getDashboard
      summary: Get dashboard metadata and published configuration
      x-m0-status: implemented
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Dashboards]
      operationId: updateDashboard
      summary: Update dashboard metadata
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Dashboards]
      operationId: deleteDashboard
      summary: Delete a dashboard
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [Dashboards]
      operationId: getDashboardDraft
      summary: Get the draft configuration (editor only)
      description: Requires edit permission. Viewers never receive draft data.
      x-m0-status: implemented
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Dashboards]
      operationId: saveDashboardDraft
      summary: Save the draft configuration
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [Dashboards]
      operationId: publishDashboard
      summary: Publish the draft and create a version
      description: Requires dashboard.publish. Atomic config copy, revision increment and version insert.
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [Dashboard versions]
      operationId: listDashboardVersions
      summary: List published versions
      description: Requires dashboard.read. Summaries only; version configuration is not returned.
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [Dashboard versions]
      operationId: restoreDashboardVersion
      summary: Restore a version as a new draft
      description: Requires dashboard.update. Does not publish; increments the revision and returns the new draft.
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Draft replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDraft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [Shares]
      operationId: listDashboardShares
      summary: List dashboard shares
      x-m0-status: implemented
      responses:
        '200':
          description: Shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Shares]
      operationId: replaceDashboardShares
      summary: Replace dashboard shares
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareListReplace'
      responses:
        '200':
          description: Shares replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/embed-tokens:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [Embed tokens]
      operationId: issueEmbedToken
      summary: Issue a scoped embed token
      description: Requires dashboard.share. The plaintext token is returned once and never stored.
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedTokenRequest'
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedTokenIssued'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/dashboards/{id}/embed-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
      - $ref: '#/components/parameters/EmbedTokenId'
    delete:
      tags: [Embed tokens]
      operationId: revokeEmbedToken
      summary: Revoke an embed token
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/data-sources:
    get:
      tags: [Data sources]
      operationId: listDataSources
      summary: List authorized data sources
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Data sources]
      operationId: createDataSource
      summary: Create a data source
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/data-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/DataSourceId'
    get:
      tags: [Data sources]
      operationId: getDataSource
      summary: Get data-source metadata (credentials are never returned)
      x-m0-status: implemented
      responses:
        '200':
          description: Data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Data sources]
      operationId: updateDataSource
      summary: Update a data source
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Data sources]
      operationId: deleteDataSource
      summary: Delete a data source
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/data-sources/{id}/test:
    parameters:
      - $ref: '#/components/parameters/DataSourceId'
    post:
      tags: [Data sources]
      operationId: testDataSource
      summary: Test connectivity and permissions
      x-m0-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional unsaved connection settings to test
              additionalProperties: true
      responses:
        '200':
          description: Test result (delivered with the M7 data adapters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceTestResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501':
          description: The connector does not support connectivity testing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }

  /v1/data-sources/{id}/schema:
    parameters:
      - $ref: '#/components/parameters/DataSourceId'
    get:
      tags: [Data sources]
      operationId: getDataSourceSchema
      summary: Discover datasets and fields exposed by a data source
      x-m0-status: implemented
      responses:
        '200':
          description: Discovered datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceSchema'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501':
          description: The connector does not support schema discovery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/queries/execute:
    post:
      tags: [Queries]
      operationId: executeQuery
      summary: Execute a query
      description: Server-side execution with 15 s timeout and 10,000 rows / 5 MiB caps.
      x-m0-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/queries/validate:
    post:
      tags: [Queries]
      operationId: validateQuery
      summary: Validate a query without executing it
      x-m0-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryValidateResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/stream:
    get:
      tags: [Realtime]
      operationId: streamEvents
      summary: Server-Sent Events fallback for the realtime protocol
      description: |
        One stream per subscription, used where the host cannot proxy WebSocket
        upgrades. The first frame is `subscribed`, followed by `snapshot` (or
        replayed `data`) frames. Each frame carries its per-subscription
        `sequence` in the SSE `id` field; send `Last-Event-ID` to resume after a
        dropped connection. WebSocket clients use `/ws/v1` with the same
        messages (see `docs/architecture/realtime-protocol.md`). The endpoint
        re-authorizes the data source on every connection and resolves
        variables and filters server-side.
      x-m0-status: implemented
      security:
        - sessionCookie: []
        - embedBearer: []
      parameters:
        - name: dataSourceId
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: queryId
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: query
          in: query
          required: true
          description: JSON-encoded query definition; must carry the same `queryId`.
          schema: { type: string, maxLength: 20000 }
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/StreamMode'
        - name: resumeFrom
          in: query
          description: Last applied sequence; overridden by `Last-Event-ID`.
          schema: { type: integer, minimum: 0 }
        - name: subscriptionId
          in: query
          description: Client subscription id; generated when omitted.
          schema: { type: string, maxLength: 120 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Event stream (`event` is one of `subscribed`, `snapshot`, `data`, `gap`, `error`)
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/widgets:
    get:
      tags: [Widgets]
      operationId: listWidgets
      summary: List available widget definitions
      x-m0-status: proposed
      responses:
        '200':
          description: Widgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/organizations/{id}/members:
